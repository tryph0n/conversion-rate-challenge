[project]
name = "conversion-rate-challenge"
version = "0.1.0"
description = "ML challenge to predict newsletter conversions"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ipykernel>=6.25.0",
    "joblib>=1.5.3",
    "jupyter>=1.0.0",
    "kaleido>=0.2.1",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "plotly>=5.15.0",
    "scikit-learn>=1.8,<1.9",
    "streamlit>=1.54.0",
    "tqdm>=4.67.0",
]

[project.urls]
Homepage = "https://github.com/tryph0n/conversion-rate-challenge"
Repository = "https://github.com/tryph0n/conversion-rate-challenge"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff==0.15.0",
]
